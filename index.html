<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magene Speed Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script>
window.onerror = function(m, src, line) {
  var d = document.getElementById('dbg');
  if (d) { d.style.color = '#f87171'; d.textContent = 'ERROR: ' + m + ' (línea ' + line + ')'; }
};
</script>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; }
  body { background:#0b0f19; color:#fff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; display:flex; flex-direction:column; height:100dvh; }
  #header { padding:28px 15px 18px; text-align:center; background:linear-gradient(180deg,#1e1b4b 0%,#0b0f19 100%); }
  h1 { margin:0; font-size:1.5rem; letter-spacing:2px; color:#f3f4f6; }
  h1 span { background:linear-gradient(90deg,#3b82f6,#10b981,#eab308,#ef4444,#d946ef); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #header p { margin:8px 0 0; font-size:.9rem; color:#9ca3af; }
  .bar { height:6px; width:70%; max-width:320px; margin:16px auto 0; border-radius:3px; background:linear-gradient(90deg,#3b82f6,#10b981,#84cc16,#eab308,#f97316,#ef4444,#be123c,#d946ef,#ffffff); }
  #drop-zone { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; border:2px dashed #4f46e5; margin:15px; border-radius:20px; cursor:pointer; text-align:center; padding:20px; background:radial-gradient(circle at 50% 35%,rgba(79,70,229,.18),transparent 65%); }
  #drop-zone:active { background:#1f2937; border-color:#3b82f6; }
  #drop-zone p { margin:8px 0 0; font-size:.85rem; color:#9ca3af; }
  .icon-upload { margin-bottom:14px; }
  .pick { margin-top:18px; padding:12px 26px; border-radius:999px; background:linear-gradient(90deg,#3b82f6,#8b5cf6); color:#fff; font-weight:600; font-size:1rem; }
  #status { font-size:.9rem; color:#fbbf24; margin-top:12px; }
  .legend { background:rgba(17,24,39,.92); color:#fff; padding:8px 10px; border-radius:8px; font-size:12px; line-height:18px; }
  .legend i { display:inline-block; width:12px; height:12px; margin-right:6px; border-radius:2px; vertical-align:middle; }
  .legend hr { border:0; border-top:1px solid #374151; margin:6px 0; }
  .btn { background:#111827; color:#fff; border:1px solid #374151; padding:8px 12px; border-radius:8px; font-size:13px; }
  #map { display:none; flex:1; min-height:0; width:100%; }
</style>
</head>
<body>

<div id="header">
  <h1>⚡ MAGENE <span>SPEED MAP</span></h1>
  <p>Mira tu ruta pintada por velocidad</p>
  <div class="bar"></div>
  <p id="dbg" style="font-size:.7rem;color:#6b7280">versión 4 · cargando...</p>
</div>

<label id="drop-zone" for="file-input">
  <div class="icon-upload">
    <svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 74 C 26 74, 24 46, 40 46 S 58 70, 70 52 S 78 28, 86 24" stroke="url(#g)" stroke-width="7" stroke-linecap="round" fill="none"/>
      <circle cx="12" cy="74" r="7" fill="#3b82f6"/>
      <circle cx="86" cy="24" r="7" fill="#d946ef"/>
      <defs><linearGradient id="g" x1="12" y1="0" x2="86" y2="0" gradientUnits="userSpaceOnUse">
        <stop stop-color="#3b82f6"/><stop offset=".35" stop-color="#10b981"/><stop offset=".6" stop-color="#eab308"/><stop offset=".8" stop-color="#ef4444"/><stop offset="1" stop-color="#d946ef"/>
      </linearGradient></defs>
    </svg>
  </div>
  <strong style="font-size:1.1rem">Sube tu ruta</strong>
  <p>Archivos .FIT o .GPX</p>
  <div class="pick">Elegir archivo</div>
  <div id="status"></div>
  <input type="file" id="file-input" style="position:absolute;opacity:0;width:1px;height:1px">
</label>

<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<script>
let map = null;
const fileInput = document.getElementById('file-input');
const dropZone  = document.getElementById('drop-zone');
const mapEl     = document.getElementById('map');
const statusEl  = document.getElementById('status');

// Lector FIT propio (sin librerías externas). Extrae los mensajes "record" (20).
function decodeFit(buffer) {
  if (buffer.byteLength < 14) throw new Error('Archivo FIT demasiado corto');
  const dv = new DataView(buffer);
  const headerSize = dv.getUint8(0);
  const sig = String.fromCharCode(dv.getUint8(8), dv.getUint8(9), dv.getUint8(10), dv.getUint8(11));
  if (sig !== '.FIT') throw new Error('No es un archivo FIT válido');
  const dataSize = dv.getUint32(4, true);
  const end = Math.min(buffer.byteLength, headerSize + dataSize);
  const SEMI = 180 / 2147483648;
  const defs = {};
  const out = [];
  let pos = headerSize, lastTs = 0;

  while (pos < end) {
    const h = dv.getUint8(pos++);
    let lt, ts = null;

    if (h & 0x80) {                       // cabecera con timestamp comprimido
      lt = (h >> 5) & 0x03;
      const off = h & 0x1f, base = lastTs & ~0x1f;
      lastTs = off >= (lastTs & 0x1f) ? base + off : base + 0x20 + off;
      ts = lastTs;
    } else if (h & 0x40) {                // definición de mensaje
      lt = h & 0x0f;
      const hasDev = (h & 0x20) !== 0;
      pos++;                              // reservado
      const little = dv.getUint8(pos++) === 0;
      const global = dv.getUint16(pos, little); pos += 2;
      const n = dv.getUint8(pos++);
      const fields = []; let size = 0;
      for (let i = 0; i < n; i++) {
        const num = dv.getUint8(pos), s = dv.getUint8(pos + 1);
        fields.push({ num, size: s }); size += s; pos += 3;
      }
      if (hasDev) {
        const nd = dv.getUint8(pos++);
        for (let i = 0; i < nd; i++) { size += dv.getUint8(pos + 1); pos += 3; }
      }
      defs[lt] = { little, global, fields, size };
      continue;
    } else {
      lt = h & 0x0f;                      // mensaje de datos normal
    }

    const def = defs[lt];
    if (!def) throw new Error('FIT corrupto (falta definición)');
    const isRecord = def.global === 20;
    const r = { lat: null, lng: null, speed: null, espeed: null, time: ts };
    let p = pos;

    for (const f of def.fields) {
      const s = f.size;
      if (f.num === 253 && s === 4) {
        const v = dv.getUint32(p, def.little);
        if (v !== 0xFFFFFFFF) { lastTs = v; r.time = v; }
      } else if (isRecord) {
        if ((f.num === 0 || f.num === 1) && s === 4) {
          const v = dv.getInt32(p, def.little);
          if (v !== 0x7FFFFFFF) { if (f.num === 0) r.lat = v * SEMI; else r.lng = v * SEMI; }
        } else if (f.num === 6 && s === 2) {
          const v = dv.getUint16(p, def.little);
          if (v !== 0xFFFF) r.speed = v / 1000 * 3.6;
        } else if (f.num === 73 && s === 4) {
          const v = dv.getUint32(p, def.little);
          if (v !== 0xFFFFFFFF) r.espeed = v / 1000 * 3.6;
        }
      }
      p += s;
    }
    pos += def.size;

    if (isRecord && r.lat !== null && r.lng !== null && (r.lat !== 0 || r.lng !== 0)) {
      out.push({
        lat: r.lat, lng: r.lng,
        speed: r.espeed ?? r.speed ?? 0,
        time: r.time !== null ? (r.time + 631065600) * 1000 : null
      });
    }
  }
  return out;
}

function haversine(a, b) {
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
  const x = Math.sin(dLat/2)**2 + Math.cos(a.lat*rad) * Math.cos(b.lat*rad) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(x));
}

// Si el archivo no trae velocidad, se calcula con distancia/tiempo
function fillMissingSpeed(points) {
  for (let i = 0; i < points.length - 1; i++) {
    const a = points[i], b = points[i + 1];
    if (a.speed > 0 || !a.time || !b.time) continue;
    const dt = (b.time - a.time) / 1000;
    if (dt > 0) a.speed = (haversine(a, b) / dt) * 3.6;
  }
}

function getColor(s) {
  if (s > 70) return '#ffffff';
  if (s > 60) return '#d946ef';
  if (s > 50) return '#be123c';
  if (s > 40) return '#ef4444';
  if (s > 35) return '#f97316';
  if (s > 28) return '#eab308';
  if (s > 20) return '#84cc16';
  if (s > 12) return '#10b981';
  return '#3b82f6';
}

function initMap() {
  dropZone.style.display = 'none';
  mapEl.style.display = 'block';
  map = L.map('map');
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    maxZoom: 19, subdomains: 'abcd', attribution: '© OpenStreetMap © CARTO'
  }).addTo(map);
  const again = L.control({ position: 'topright' });
  again.onAdd = () => {
    const b = L.DomUtil.create('button', 'btn');
    b.textContent = '📁 Otra ruta';
    L.DomEvent.on(b, 'click', () => location.reload());
    return b;
  };
  again.addTo(map);
  map.invalidateSize();
}

function drawSpeedRoute(points) {
  fillMissingSpeed(points);
  initMap();
  let max = 0, sum = 0;
  for (let i = 0; i < points.length - 1; i++) {
    const p1 = points[i], p2 = points[i + 1];
    max = Math.max(max, p1.speed); sum += p1.speed;
    L.polyline([[p1.lat, p1.lng], [p2.lat, p2.lng]], { color: getColor(p1.speed), weight: 5, opacity: 0.9 }).addTo(map);
  }
  const avg = sum / Math.max(1, points.length - 1);

  const legend = L.control({ position: 'bottomleft' });
  legend.onAdd = () => {
    const d = L.DomUtil.create('div', 'legend');
    d.innerHTML = [['#ffffff','> 70 km/h'],['#d946ef','60–70'],['#be123c','50–60'],['#ef4444','40–50'],['#f97316','35–40'],['#eab308','28–35'],['#84cc16','20–28'],['#10b981','12–20'],['#3b82f6','< 12']]
      .map(([c,t]) => `<i style="background:${c}"></i>${t}`).join('<br>')
      + `<hr>Máx: ${max.toFixed(1)} km/h<br>Prom: ${avg.toFixed(1)} km/h<br>Puntos: ${points.length}`;
    return d;
  };
  legend.addTo(map);

  const bounds = L.latLngBounds(points.map(p => [p.lat, p.lng]));
  const fit = () => { map.invalidateSize(); map.fitBounds(bounds, { padding: [30, 30] }); };
  fit(); setTimeout(fit, 300);

  if (max === 0) alert('El archivo no trae velocidad ni hora, por eso todo sale azul.');
}

function decodeGpx(text) {
  const xml = new DOMParser().parseFromString(text, 'text/xml');
  let nodes = xml.getElementsByTagName('trkpt');
  if (!nodes.length) nodes = xml.getElementsByTagName('rtept');
  const points = [];
  for (let i = 0; i < nodes.length; i++) {
    const t = nodes[i];
    const lat = parseFloat(t.getAttribute('lat')), lng = parseFloat(t.getAttribute('lon'));
    if (isNaN(lat) || isNaN(lng)) continue;
    const sp = t.getElementsByTagNameNS('*', 'speed')[0];
    const tm = t.getElementsByTagName('time')[0];
    points.push({ lat, lng,
      speed: sp ? parseFloat(sp.textContent) * 3.6 : 0,
      time: tm ? new Date(tm.textContent).getTime() : null });
  }
  return points;
}

// Detecta el tipo por el CONTENIDO, no por el nombre (sirve con "ruta.gpx." o "ruta")
function handleBuffer(buffer) {
  const head = new Uint8Array(buffer, 0, Math.min(buffer.byteLength, 16));
  const isFit = head.length >= 12 && String.fromCharCode(head[8], head[9], head[10], head[11]) === '.FIT';
  let points;
  if (isFit) {
    points = decodeFit(buffer);
  } else {
    const text = new TextDecoder('utf-8').decode(buffer);
    if (!/<gpx|<trkpt|<rtept/i.test(text)) throw new Error('El archivo no es FIT ni GPX.');
    points = decodeGpx(text);
  }
  if (!points.length) throw new Error('El archivo no contiene coordenadas GPS (¿ruta en interior?).');
  statusEl.textContent = 'Dibujando ' + points.length + ' puntos...';
  setTimeout(() => {
    try { drawSpeedRoute(points); }
    catch (e) { statusEl.textContent = ''; alert('Error al dibujar: ' + e.message); }
  }, 30);
}

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  statusEl.textContent = 'Leyendo ' + file.name + ' (' + Math.round(file.size/1024) + ' KB)...';
  const reader = new FileReader();
  reader.onerror = () => { statusEl.textContent = ''; alert('No se pudo leer el archivo.'); };
  reader.onload = (ev) => {
    try { handleBuffer(ev.target.result); }
    catch (err) { statusEl.textContent = ''; alert('Error: ' + err.message); }
  };
  reader.readAsArrayBuffer(file);
});

// Aviso de que todo cargó bien
document.getElementById('dbg').textContent = (typeof L === 'undefined')
  ? 'versión 4 · ERROR: no cargó el mapa (Leaflet)'
  : 'versión 4 · listo ✔';
</script>
</body>
</html>
