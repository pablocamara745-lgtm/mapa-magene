<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magene Speed Map</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
        }
        #header {
            background: #111827;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #1f2937;
        }
        h1 {
            margin: 0;
            font-size: 1.2rem;
            color: #f3f4f6;
        }
        p {
            margin: 5px 0 0 0;
            font-size: 0.85rem;
            color: #9ca3af;
        }
        #drop-zone {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px dashed #374151;
            margin: 15px;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            padding: 20px;
        }
        #drop-zone:active {
            background-color: #1f2937;
            border-color: #3b82f6;
        }
        #map {
            display: none;
            width: 100%;
            flex: 1;
        }
        .icon-upload {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div id="header">
        <h1>⚡ MAGENE SPEED MAP</h1>
        <p>Sube tu archivo .fit o .gpx para ver la velocidad por colores</p>
    </div>

    <div id="drop-zone" onclick="document.getElementById('file-input').click()">
        <div class="icon-upload">📁</div>
        <strong>Toca aquí para seleccionar tu ruta</strong>
        <p>Soporta archivos .FIT y .GPX</p>
        <input type="file" id="file-input" accept=".gpx,.fit" style="display: none;">
    </div>

    <div id="map"></div>

    <!-- Leaflet JS y Parsers -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/fit-file-parser@1.9.0/dist/fit-parser.min.js"></script>

    <script>
        let map = null;

        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');
        const mapElement = document.getElementById('map');

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();

            if (file.name.toLowerCase().endsWith('.fit')) {
                reader.onload = function(event) {
                    processFitData(event.target.result);
                };
                reader.readAsArrayBuffer(file);
            } else if (file.name.toLowerCase().endsWith('.gpx')) {
                reader.onload = function(event) {
                    processGpxData(event.target.result);
                };
                reader.readAsText(file);
            } else {
                alert("Por favor, sube un archivo .FIT o .GPX válido.");
            }
        });

        // Obtener color según la velocidad en km/h
        function getColor(speed) {
            if (speed > 40) return '#ef4444'; // Rojo (Muy rápido)
            if (speed > 35) return '#f97316'; // Naranja
            if (speed > 28) return '#eab308'; // Amarillo
            if (speed > 20) return '#84cc16'; // Verde claro
            if (speed > 12) return '#10b981'; // Verde
            return '#3b82f6';                // Azul (Lento / Subida)
        }

        function initMap() {
            dropZone.style.display = 'none';
            mapElement.style.display = 'block';

            if (!map) {
                map = L.map('map');
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap'
                }).addTo(map);
            }
        }

        // Procesar archivo FIT de Magene
        function processFitData(buffer) {
            const fitParser = new FitParser({ force: true, speedUnit: 'km/h' });
            
            fitParser.parse(buffer, (error, data) => {
                if (error) {
                    alert("Error al leer el archivo FIT de Magene.");
                    return;
                }

                const records = data.records || [];
                const points = records.filter(r => r.position_lat && r.position_long);

                if (points.length === 0) {
                    alert("El archivo no contiene coordenadas GPS válidas.");
                    return;
                }

                initMap();
                drawSpeedRoute(points.map(p => ({
                    lat: p.position_lat,
                    lng: p.position_long,
                    speed: p.speed || 0
                })));
            });
        }

        // Procesar archivo GPX
        function processGpxData(xmlText) {
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlText, "text/xml");
            const trkpts = xmlDoc.getElementsByTagName("trkpt");

            const points = [];
            for (let i = 0; i < trkpts.length; i++) {
                const lat = parseFloat(trkpts[i].getAttribute("lat"));
                const lng = parseFloat(trkpts[i].getAttribute("lon"));
                
                // Buscar etiqueta de velocidad si existe
                const speedElem = trkpts[i].getElementsByTagName("speed")[0];
                let speed = speedElem ? parseFloat(speedElem.textContent) * 3.6 : 0; // m/s a km/h

                points.push({ lat, lng, speed });
            }

            if (points.length === 0) {
                alert("No se encontraron puntos GPS en el archivo GPX.");
                return;
            }

            initMap();
            drawSpeedRoute(points);
        }

        // Pintar la ruta en el mapa tramo por tramo con colores
        function drawSpeedRoute(points) {
            const bounds = [];

            for (let i = 0; i < points.length - 1; i++) {
                const p1 = points[i];
                const p2 = points[i + 1];

                const color = getColor(p1.speed);
                const polyline = L.polyline([[p1.lat, p1.lng], [p2.lat, p2.lng]], {
                    color: color,
                    weight: 5,
                    opacity: 0.9
                }).addTo(map);

                bounds.push([p1.lat, p1.lng]);
            }

            map.fitBounds(bounds);
            setTimeout(() => { map.invalidateSize(); }, 200);
        }
    </script>
</body>
</html>
