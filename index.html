<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magene Speed Map</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
        }
        #header {
            background: #111827;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #1f2937;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 1.2rem;
            color: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        p {
            margin: 0;
            font-size: 0.85rem;
            color: #9ca3af;
        }
        #drop-zone {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px dashed #374151;
            margin: 15px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            text-align: center;
            padding: 20px;
        }
        #drop-zone:active {
            background-color: #1f2937;
            border-color: #3b82f6;
        }
        #map {
            display: none;
            width: 100%;
            flex: 1;
        }
        .icon-upload {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div id="header">
        <h1>⚡ MAGENE SPEED MAP</h1>
        <p>Suelta tu archivo .gpx o .fit y mira el mapa de colores</p>
    </div>

    <!-- Zona táctil para abrir archivos optimizada para móviles -->
    <div id="drop-zone" onclick="document.getElementById('file-input').click()">
        <div class="icon-upload">📁</div>
        <strong>Toca aquí o arrastra tu archivo de ruta</strong>
        <p style="margin-top: 5px;">Soporta GPX y FIT</p>
        <input type="file" id="file-input" accept=".gpx,.fit,application/gpx+xml" style="display: none;">
    </div>

    <!-- Contenedor del Mapa -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        let map = null;

        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');
        const mapElement = document.getElementById('map');

        // Forzar apertura del explorador al hacer clic en cualquier parte de la caja
        dropZone.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const content = event.target.result;
                // Ocultar zona de carga y mostrar mapa
                dropZone.style.display = 'none';
                mapElement.style.display = 'block';

                initMap([[41.652, -3.688]]); // Ejemplo inicial centrado aproximado (Aranda)
            };

            if (file.name.endsWith('.gpx') || file.name.endsWith('.fit')) {
                reader.readAsText(file);
            } else {
                alert("Sube un archivo .gpx o .fit válido, máquina.");
            }
        });

        function initMap(coords) {
            if (!map) {
                map = L.map('map').setView(coords[0], 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap'
                }).addTo(map);
            }
            // Aquí pintarías tu ruta con los colores de velocidad cuando proceses los points.
            setTimeout(() => { map.invalidateSize(); }, 200);
        }
    </script>
</body>
</html>
